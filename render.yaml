services:
  - type: web
    name: biteq
    runtime: python
    plan: free
    rootDir: bitq
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn bitq.wsgi:application
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: biteq-db
          property: connectionString
      - key: BITQ_ADMIN_ACCESS_CODE
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: biteq-db
    plan: free
    databaseName: biteq
    user: biteq