<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ restaurant.name }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            color: #1f2937;
        }
        .card {
            width: min(860px, 92%);
            background: rgba(255,255,255,0.95);
            border: 1px solid #fed7aa;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(124,45,18,0.12);
            padding: 30px;
        }
        .content {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 24px;
            align-items: center;
        }
        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid #fdba74;
        }
        h1 {
            margin: 0 0 16px;
            color: #9a3412;
            font-size: clamp(2rem, 4vw, 2.8rem);
        }
        .meta {
            line-height: 1.8;
            font-size: 1.05rem;
        }
        .meta strong { color: #7c2d12; }
        .actions {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        a {
            text-decoration: none;
            background: #ea580c;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
        }
        .secondary {
            background: #1f2937;
        }
        @media (max-width: 700px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="content">
            <div>
                {% if restaurant.photo %}
                    <img src="{{ restaurant.photo.url }}" alt="{{ restaurant.name }}">
                {% elif restaurant.picture %}
                    <img src="{{ restaurant.picture }}" alt="{{ restaurant.name }}">
                {% else %}
                    <img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80" alt="Restaurant image">
                {% endif %}
            </div>
            <div>
                <h1>{{ restaurant.name }}</h1>
                <div class="meta">
                    <div><strong>Cuisine:</strong> {{ restaurant.cuisine }}</div>
                    <div><strong>Rating:</strong> {{ restaurant.rating }}</div>
                    <div><strong>Operating Hours:</strong> {{ restaurant.operating_hours }}</div>
                </div>

                <div class="actions">
                    <a href="{% url 'restaurant_list' %}">Back to Restaurants</a>
                    {% if is_admin %}
                        <a class="secondary" href="{% url 'update_restaurant' restaurant.id %}">Edit</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
